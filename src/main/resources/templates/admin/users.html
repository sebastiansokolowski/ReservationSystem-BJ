<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Użytkownicy | BJ Pralnia</title>
    <th:block th:include="fragments/header :: header-css"></th:block>
</head>
<body>
<div class="app-shell">
    <div th:replace="fragments/header :: menu"></div>

    <main class="page">
        <div class="container">
            <a class="link-back" th:href="@{/type}">Wróć do panelu</a>
            <div class="page-head">
                <div class="page-head__copy">
                    <p class="eyebrow">Administracja</p>
                    <h1>Użytkownicy</h1>
                    <p class="lead">Zarządzaj kontami mieszkańców, przydziałem pokojów i pulą tokenów.</p>
                </div>
                <span class="token-badge">Liczba kont: <strong th:text="${count}">0</strong></span>
            </div>

            <section class="surface table-card">
                <div class="table-scroll">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>Pokój</th>
                            <th>Imię i nazwisko</th>
                            <th>Login</th>
                            <th>E-mail</th>
                            <th>Tokeny</th>
                            <th>Rola</th>
                            <th>Status</th>
                            <th>Akcje</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="account : ${users}">
                            <td><span th:text="${account.room.room}">101</span><span th:text="${account.room.type}">A</span></td>
                            <td th:text="${account.name + ' ' + account.surname}">Jan Kowalski</td>
                            <td th:text="${account.username}">login</td>
                            <td th:text="${account.email}">email@example.com</td>
                            <td><strong th:text="${account.tokens}">0</strong></td>
                            <td th:text="${account.role}">USER</td>
                            <td>
                                <span class="status-pill" th:classappend="${account.blocked} ? 'status-pill--danger' : ''"
                                      th:text="${account.blocked} ? 'Zablokowany' : 'Aktywny'">Aktywny</span>
                            </td>
                            <td>
                                <div class="table-actions">
                                    <a class="btn btn--secondary btn--small"
                                       th:href="@{/admin/users/edit/{id}(id=${account.id})}">Edytuj</a>
                                    <form th:action="@{/admin/users/delete/{id}(id=${account.id})}" method="get"
                                          data-confirm="Czy na pewno chcesz usunąć tego użytkownika? Tej operacji nie można cofnąć.">
                                        <button class="btn btn--danger btn--small" type="submit">Usuń</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="8" class="muted">Brak użytkowników do wyświetlenia.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</div>
</body>
</html>
