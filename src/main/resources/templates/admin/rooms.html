<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pokoje | BJ Pralnia</title>
    <th:block th:include="fragments/header :: header-css"></th:block>
</head>
<body>
<div class="app-shell">
    <div th:replace="fragments/header :: menu"></div>

    <main class="page">
        <div class="container">
            <a class="link-back" th:href="@{/type}">Wróć do panelu</a>
            <div class="page-head">
                <div class="page-head__copy">
                    <p class="eyebrow">Administracja</p>
                    <h1>Pokoje</h1>
                    <p class="lead">Zarządzaj pokojami i liczbą dostępnych miejsc dla mieszkańców.</p>
                </div>
                <span class="token-badge">Liczba pokojów: <strong th:text="${count}">0</strong></span>
            </div>

            <section class="surface table-card">
                <div class="table-scroll">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>Pokój</th>
                            <th>Strefa</th>
                            <th>Liczba miejsc</th>
                            <th>Akcja</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="room : ${rooms}">
                            <td><strong><span th:text="${room.room}">101</span><span th:text="${room.type}">A</span></strong></td>
                            <td>
                                <span class="status-pill" th:classappend="${room.students} ? '' : 'status-pill--danger'"
                                      th:text="${room.students} ? 'Studencka' : 'Pozostała'">Studencka</span>
                            </td>
                            <td th:text="${room.people}">1</td>
                            <td>
                                <a class="btn btn--secondary btn--small"
                                   th:href="@{/admin/rooms/edit/{id}(id=${room.id})}">Edytuj</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(rooms)}">
                            <td colspan="4" class="muted">Brak pokojów do wyświetlenia.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</div>
</body>
</html>
