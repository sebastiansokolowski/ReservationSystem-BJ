<!DOCTYPE html>
<html lang="pl" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{title.rooms}">Pokoje | BJ Pralnia</title>
    <th:block th:include="fragments/header :: header-css"></th:block>
</head>
<body>
<div class="app-shell">
    <div th:replace="fragments/header :: menu"></div>

    <main class="page">
        <div class="container">
            <a class="link-back" th:href="@{/type}" th:text="#{common.backToDashboard}">Wróć do panelu</a>
            <div class="page-head">
                <div class="page-head__copy">
                    <p class="eyebrow" th:text="#{common.administration}">Administracja</p>
                    <h1 th:text="#{admin.rooms.heading}">Pokoje</h1>
                    <p class="lead" th:text="#{admin.rooms.lead}">Zarządzaj pokojami i liczbą dostępnych miejsc dla mieszkańców.</p>
                </div>
                <span class="token-badge"><span th:text="#{admin.rooms.count}">Liczba pokojów:</span> <strong th:text="${count}">0</strong></span>
            </div>

            <section class="surface table-card">
                <div class="table-scroll">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th th:text="#{common.room}">Pokój</th>
                            <th th:text="#{admin.rooms.zone}">Strefa</th>
                            <th th:text="#{admin.room.capacity}">Liczba miejsc</th>
                            <th th:text="#{admin.rooms.action}">Akcja</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="room : ${rooms}">
                            <td><strong><span th:text="${room.room}">101</span><span th:text="${room.type}">A</span></strong></td>
                            <td>
                                <span class="status-pill" th:classappend="${room.students} ? '' : 'status-pill--danger'">
                                    <span th:if="${room.students}" th:text="#{admin.zone.student}">Studencka</span>
                                    <span th:unless="${room.students}" th:text="#{admin.zone.other}">Asystencka</span>
                                </span>
                            </td>
                            <td th:text="${room.people}">1</td>
                            <td>
                                <a class="btn btn--secondary btn--small"
                                   th:href="@{/admin/rooms/edit/{id}(id=${room.id})}" th:text="#{admin.rooms.edit}">Edytuj</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(rooms)}">
                            <td colspan="4" class="muted" th:text="#{admin.rooms.empty}">Brak pokojów do wyświetlenia.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</div>
</body>
</html>
