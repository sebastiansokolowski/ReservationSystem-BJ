<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edycja pokoju | BJ Pralnia</title>
    <th:block th:include="fragments/header :: header-css"></th:block>
</head>
<body>
<div class="app-shell">
    <div th:replace="fragments/header :: menu"></div>

    <main class="page page--narrow">
        <div class="container">
            <a class="link-back" th:href="@{/admin/rooms}">Wróć do pokojów</a>
            <div class="page-head">
                <div class="page-head__copy">
                    <p class="eyebrow">Administracja</p>
                    <h1>Edytuj pokój</h1>
                    <p class="lead">Pokój: <strong><span th:text="${roomModel.room}">101</span><span th:text="${roomTypes[roomModel.typeId]}">A</span></strong></p>
                </div>
            </div>

            <section class="surface form-card">
                <form class="form-stack" th:object="${roomModel}"
                      th:action="@{/admin/rooms/edit/{id}(id=${roomModel.id})}" method="post"
                      data-confirm="Czy na pewno chcesz zapisać zmiany danych tego pokoju?">
                    <div class="form-row">
                        <div class="field">
                            <label for="room">Numer pokoju</label>
                            <input id="room" type="number" th:field="*{room}" min="1" max="999"
                                   required="required"/>
                        </div>
                        <div class="field">
                            <label for="typeId">Typ pokoju</label>
                            <select id="typeId" th:field="*{typeId}" required="required">
                                <option th:each="type, iteration : ${roomTypes}"
                                        th:value="${iteration.count - 1}" th:text="${type}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="field">
                        <label for="people">Liczba miejsc</label>
                        <input id="people" type="number" th:field="*{people}" min="1" max="99"
                               required="required"/>
                    </div>

                    <label class="toggle-section check-row" for="students">
                        <input id="students" type="checkbox" th:field="*{students}"/>
                        <span><strong>Część studencka</strong><br/><span class="muted">Pokój należy do części przeznaczonej dla studentów.</span></span>
                    </label>

                    <button class="btn btn--block" type="submit">Zapisz zmiany</button>
                </form>
            </section>
        </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</div>
</body>
</html>
