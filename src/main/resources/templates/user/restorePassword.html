<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Odzyskaj hasło | BJ Pralnia</title>
    <th:block th:include="fragments/header :: header-css"></th:block>
</head>
<body>
<div class="app-shell">
    <div th:replace="fragments/header :: menu"></div>

    <main class="page page--narrow">
        <div class="container">
            <a class="link-back" th:href="@{/}">Wróć do logowania</a>
            <div class="page-head">
                <div class="page-head__copy">
                    <p class="eyebrow">Pomoc z logowaniem</p>
                    <h1>Odzyskaj hasło</h1>
                    <p class="lead">Podaj adres e-mail przypisany do konta. Wyślemy na niego link do ustawienia nowego hasła.</p>
                </div>
            </div>

            <section class="surface form-card">
                <form class="form-stack" th:object="${restorePasswordModel}"
                      th:action="@{/user/restorePassword}" method="post">
                    <div class="field">
                        <label for="email">Adres e-mail</label>
                        <input id="email" type="email" th:field="*{email}" autocomplete="email"
                               required="required"/>
                        <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                    </div>
                    <div class="alert alert--success" th:if="${successMessage}" th:text="${successMessage}"></div>
                    <button class="btn btn--block" type="submit">Wyślij link resetujący</button>
                </form>
            </section>
        </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</div>
</body>
</html>
