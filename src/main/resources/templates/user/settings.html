<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ustawienia konta | BJ Pralnia</title>
    <th:block th:include="fragments/header :: header-css"></th:block>
</head>
<body>
<div class="app-shell">
    <div th:replace="fragments/header :: menu"></div>

    <main class="page page--narrow">
        <div class="container">
            <a class="link-back" th:href="@{/type}">Wróć do panelu</a>

            <div class="page-head">
                <div class="page-head__copy">
                    <p class="eyebrow">Twoje konto</p>
                    <h1>Ustawienia konta</h1>
                    <p class="lead">Zaznacz dane, które chcesz zaktualizować, a następnie potwierdź zmianę obecnym hasłem.</p>
                </div>
            </div>

            <section class="surface form-card">
                <form class="form-stack" th:object="${userSettingsModel}" th:action="@{/user/settings}" method="post">
                    <div class="toggle-section">
                        <label class="check-row" for="setNewUsername">
                            <input id="setNewUsername" type="checkbox" th:field="*{setNewUsername}"
                                   data-enable-target="#newUsername"/>
                            <strong>Zmień login</strong>
                        </label>
                        <div class="toggle-section__body">
                            <div class="field">
                                <label for="newUsername">Nowy login</label>
                                <input id="newUsername" type="text" th:field="*{newUsername}" minlength="3"
                                       maxlength="30" disabled="disabled" required="required"/>
                                <p class="field-error" th:if="${#fields.hasErrors('newUsername')}"
                                   th:errors="*{newUsername}"></p>
                            </div>
                        </div>
                    </div>

                    <div class="toggle-section">
                        <label class="check-row" for="setNewEmail">
                            <input id="setNewEmail" type="checkbox" th:field="*{setNewEmail}"
                                   data-enable-target="#newEmail"/>
                            <strong>Zmień adres e-mail</strong>
                        </label>
                        <div class="toggle-section__body">
                            <div class="field">
                                <label for="newEmail">Nowy adres e-mail</label>
                                <input id="newEmail" type="email" th:field="*{newEmail}" disabled="disabled"
                                       required="required"/>
                                <p class="field-error" th:if="${#fields.hasErrors('newEmail')}"
                                   th:errors="*{newEmail}"></p>
                            </div>
                        </div>
                    </div>

                    <div class="toggle-section">
                        <label class="check-row" for="setNewPassword">
                            <input id="setNewPassword" type="checkbox" th:field="*{setNewPassword}"
                                   data-enable-target="#newPassword, #newPasswordRepeat"/>
                            <strong>Zmień hasło</strong>
                        </label>
                        <div class="toggle-section__body form-row">
                            <div class="field">
                                <label for="newPassword">Nowe hasło</label>
                                <input id="newPassword" type="password" th:field="*{newPassword}" minlength="5"
                                       maxlength="30" autocomplete="new-password" disabled="disabled"
                                       required="required"/>
                                <p class="field-error" th:if="${#fields.hasErrors('newPassword')}"
                                   th:errors="*{newPassword}"></p>
                            </div>
                            <div class="field">
                                <label for="newPasswordRepeat">Powtórz nowe hasło</label>
                                <input id="newPasswordRepeat" type="password" th:field="*{newPasswordRepeat}"
                                       minlength="5" maxlength="30" autocomplete="new-password" disabled="disabled"
                                       required="required"/>
                                <p class="field-error" th:if="${#fields.hasErrors('newPasswordRepeat')}"
                                   th:errors="*{newPasswordRepeat}"></p>
                            </div>
                        </div>
                    </div>

                    <div class="form-section">
                        <div>
                            <h2>Potwierdź zmiany</h2>
                            <p class="muted">Ze względów bezpieczeństwa wpisz aktualne hasło.</p>
                        </div>
                        <div class="field">
                            <label for="password">Aktualne hasło</label>
                            <input id="password" type="password" th:field="*{password}" autocomplete="current-password"
                                   required="required"/>
                            <p class="field-error" th:if="${#fields.hasErrors('password')}"
                               th:errors="*{password}"></p>
                        </div>
                        <div class="alert alert--success" th:if="${successMessage}" th:text="${successMessage}"></div>
                        <button class="btn" type="submit">Zapisz ustawienia</button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</div>
</body>
</html>
