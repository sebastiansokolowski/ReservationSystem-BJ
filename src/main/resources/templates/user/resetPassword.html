<!DOCTYPE html>
<html lang="pl" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{title.resetPassword}">Nowe hasło | BJ Pralnia</title>
    <th:block th:include="fragments/header :: header-css"></th:block>
</head>
<body>
<div class="app-shell">
    <div th:replace="fragments/header :: menu"></div>

    <main class="page page--narrow">
        <div class="container">
            <div class="page-head">
                <div class="page-head__copy">
                    <p class="eyebrow" th:text="#{reset.eyebrow}">Bezpieczeństwo konta</p>
                    <h1 th:text="#{reset.heading}">Ustaw nowe hasło</h1>
                    <p class="lead" th:text="#{reset.lead}">Nowe hasło powinno mieć co najmniej 5 znaków.</p>
                </div>
            </div>

            <section class="surface form-card">
                <form class="form-stack" th:object="${resetPasswordModel}"
                      th:action="@{/user/resetPassword(resetPasswordKey=${resetPasswordKey})}" method="post">
                    <div class="field">
                        <label for="newPassword" th:text="#{common.newPassword}">Nowe hasło</label>
                        <input id="newPassword" type="password" th:field="*{newPassword}" minlength="5"
                               maxlength="30" autocomplete="new-password" required="required"/>
                        <p class="field-error" th:if="${#fields.hasErrors('newPassword')}"
                           th:errors="*{newPassword}"></p>
                    </div>
                    <div class="field">
                        <label for="newPasswordRepeat" th:text="#{common.repeatNewPassword}">Powtórz nowe hasło</label>
                        <input id="newPasswordRepeat" type="password" th:field="*{newPasswordRepeat}" minlength="5"
                               maxlength="30" autocomplete="new-password" required="required"/>
                        <p class="field-error" th:if="${#fields.hasErrors('newPasswordRepeat')}"
                           th:errors="*{newPasswordRepeat}"></p>
                    </div>
                    <div class="alert alert--success" th:if="${successMessage}" th:text="${successMessage}"></div>
                    <button class="btn btn--block" type="submit" th:text="#{reset.save}">Zapisz nowe hasło</button>
                </form>
            </section>
        </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</div>
</body>
</html>
