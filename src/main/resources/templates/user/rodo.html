<!DOCTYPE html>
<html lang="pl" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="#{title.privacy}">Zgody RODO | BJ Pralnia</title>
    <th:block th:include="fragments/header :: header-css"></th:block>
</head>
<body>
<div class="app-shell">
    <div th:replace="fragments/header :: menu"></div>

    <main class="page">
        <div class="container">
            <a class="link-back" th:href="@{/user/regulations}" th:text="#{privacy.back}">Wróć do regulaminu</a>
            <div class="page-head">
                <div class="page-head__copy">
                    <p class="eyebrow" th:text="#{privacy.step}">Krok 2 z 2</p>
                    <h1 th:text="#{privacy.heading}">Informacje o danych osobowych</h1>
                    <p class="lead" th:text="#{privacy.lead}">Przeczytaj informacje dotyczące przetwarzania danych w systemie rezerwacji.</p>
                </div>
            </div>

            <section class="surface panel">
                <iframe class="document-frame"
                        title="Informacje RODO" th:title="#{privacy.documentTitle}"
                        src="https://docs.google.com/document/d/1xIxqpRonfvVgEbaKFVstjVxcJ1lSKuhg/preview"
                        th:src="#{privacy.documentUrl}"></iframe>
            </section>

            <form class="legal-actions" th:action="@{/user/registration}" method="get">
                <label class="check-row" for="accept-rodo">
                    <input id="accept-rodo" type="checkbox" name="accept" value="accept" required="required"/>
                    <strong th:text="#{privacy.accept}">Zgadzam się na przetwarzanie danych</strong>
                </label>
                <button class="btn" type="submit" th:text="#{privacy.next}">Przejdź do rejestracji</button>
            </form>
        </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</div>
</body>
</html>
