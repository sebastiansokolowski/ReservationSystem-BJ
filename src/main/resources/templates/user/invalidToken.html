<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Link wygasł | BJ Pralnia</title>
    <th:block th:include="fragments/header :: header-css"></th:block>
</head>
<body>
<div class="app-shell">
    <div th:replace="fragments/header :: menu"></div>

    <main class="page page--narrow">
        <div class="container">
            <section class="surface form-card">
                <p class="eyebrow">Nieaktualny link</p>
                <h1>Link do resetowania hasła wygasł</h1>
                <p class="lead">Dla bezpieczeństwa linki resetujące działają tylko przez określony czas. Poproś o nowy link i spróbuj ponownie.</p>
                <div class="form-section">
                    <a class="btn" th:href="@{/user/restorePassword}">Wyślij nowy link</a>
                    <a class="btn btn--secondary" th:href="@{/}">Wróć do logowania</a>
                </div>
            </section>
        </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</div>
</body>
</html>
