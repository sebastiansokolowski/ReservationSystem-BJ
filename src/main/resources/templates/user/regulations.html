<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Regulamin | BJ Pralnia</title>
    <th:block th:include="fragments/header :: header-css"></th:block>
</head>
<body>
<div class="app-shell">
    <div th:replace="fragments/header :: menu"></div>

    <main class="page">
        <div class="container">
            <div class="page-head">
                <div class="page-head__copy">
                    <p class="eyebrow">Krok 1 z 2</p>
                    <h1>Regulamin pralni</h1>
                    <p class="lead">Zapoznaj się z zasadami korzystania z pralni przed utworzeniem konta.</p>
                </div>
            </div>

            <section class="surface panel">
                <iframe class="document-frame"
                        title="Regulamin korzystania z pralni"
                        src="https://docs.google.com/document/d/1UI-0DS33XgHRHhnsTIaK9tO7vb0ajt7g/preview"></iframe>
                <iframe class="document-frame"
                        title="Dodatkowe zasady korzystania z pralni"
                        src="https://docs.google.com/document/d/1egQsALlbZo359mVThlxeOSddmOeLyUln/preview"></iframe>
            </section>

            <form class="legal-actions" th:action="@{/user/rodo}" method="get">
                <label class="check-row" for="accept-regulations">
                    <input id="accept-regulations" type="checkbox" name="accept" value="accept" required="required"/>
                    <strong>Akceptuję regulamin</strong>
                </label>
                <button class="btn" type="submit">Dalej: zgody RODO</button>
            </form>
        </div>
    </main>

    <div th:replace="fragments/footer :: footer"></div>
</div>
</body>
</html>
